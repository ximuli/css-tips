<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>打字效果 · demo</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* ↓ 仅为演示页排版，不属于 tip 代码 */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #17181c;
      color: #f2efe8;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .stage {
      text-align: center;
    }

    .stage .typing-effect {
      margin: 0 auto 28px;
    }

    .label {
      margin: 0 0 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: .24em;
      color: #8f8b81;
    }

    .replay {
      padding: 6px 16px;
      border: 1px solid #3a3b41;
      border-radius: 999px;
      background: transparent;
      color: #b9b5aa;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .replay:hover {
      border-color: #6b6c73;
      color: #f2efe8;
    }
  </style>
</head>

<body>
  <div class="stage">
    <p class="label">TYPING EFFECT</p>
    <p class="typing-effect" id="target">你好啊世界！</p>
    <button class="replay" type="button">↻ 重新播放</button>
  </div>

  <script>
    // 仅演示页控制，不属于 tip 代码：替换节点即可重启动画
    document.querySelector('.replay').addEventListener('click', function () {
      var target = document.getElementById('target');
      target.replaceWith(target.cloneNode(true));
    });
  </script>
</body>

</html>
